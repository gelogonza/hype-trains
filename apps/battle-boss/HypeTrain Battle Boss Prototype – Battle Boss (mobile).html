if value=\"{{ isStream }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"position: absolute; inset: 0; display: flex; flex-direction: column\">\n\n  <sc-if value=\"{{ isPrivileged }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"flex: none; background: #ffb020; color: #1a1200; padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; gap: 8px\">\n      <span style=\"font-size: 12px; font-weight: 700\">Viewing as {{roleLabel}}<\u002Fspan>\n      <button type=\"button\" sc-camel-on-click=\"{{ openControls }}\" style=\"min-height: 36px; padding: 0 12px; border: 0; border-radius: 8px; background: #1a1200; color: #ffb020; font-weight: 700; font-size: 12px; cursor: pointer\">Open poll controls<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"position: relative; height: 196px; flex: none; background: linear-gradient(140deg, #2b1a55 0%, #173a52 100%); overflow: hidden\">\n    <svg width=\"390\" height=\"196\" sc-camel-view-box=\"0 0 390 196\" aria-hidden=\"true\" style=\"position: absolute; inset: 0\">\n      <circle cx=\"300\" cy=\"60\" r=\"86\" fill=\"#4b2d8f\" opacity=\"0.5\"><\u002Fcircle>\n      <circle cx=\"90\" cy=\"170\" r=\"104\" fill=\"#1f6f8b\" opacity=\"0.35\"><\u002Fcircle>\n      <path d=\"M0 160 L70 118 L120 146 L190 96 L260 140 L320 106 L390 146 L390 196 L0 196 Z\" fill=\"#0e0e10\" opacity=\"0.55\"><\u002Fpath>\n    <\u002Fsvg>\n    <div style=\"position: absolute; top: 12px; left: 16px; display: flex; gap: 8px; align-items: center\">\n      <span style=\"background: #e91916; color: #ffffff; font-weight: 700; font-size: 11px; letter-spacing: 0.06em; padding: 3px 8px; border-radius: 4px\">LIVE<\u002Fspan>\n      <span style=\"background: rgba(14,14,16,0.75); font-size: 12px; padding: 3px 8px; border-radius: 4px\">12.4K watching<\u002Fspan>\n    <\u002Fdiv>\n    <button type=\"button\" sc-camel-on-click=\"{{ openDemo }}\" style=\"position: absolute; top: 6px; right: 10px; min-height: 44px; padding: 0 12px; border: 0; background: transparent; color: #efeff1; font-size: 12px; font-weight: 700; cursor: pointer; text-decoration: underline\">Prototype tools<\u002Fbutton>\n    <span style=\"position: absolute; bottom: 12px; left: 16px; font-size: 12px; background: rgba(14,14,16,0.75); padding: 3px 8px; border-radius: 4px\">Mock stream preview<\u002Fspan>\n  <\u002Fdiv>\n\n  <div style=\"display: flex; gap: 12px; align-items: center; padding: 12px 16px; flex: none\">\n    <div style=\"width: 42px; height: 42px; border-radius: 21px; background: #6d3fe0; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 18px; color: #ffffff; flex: none\">N<\u002Fdiv>\n    <div style=\"display: flex; flex-direction: column; min-width: 0; flex: 1\">\n      <span style=\"font-weight: 700; font-size: 15px\">NovaKitsune<\u002Fspan>\n      <span style=\"font-size: 13px; color: #adadb8\">Chat decides what we play next<\u002Fspan>\n    <\u002Fdiv>\n    <sc-if value=\"{{ isViewer }}\" hint-placeholder-val=\"{{ true }}\">\n      <button type=\"button\" sc-camel-on-click=\"{{ openProfile }}\" style=\"min-height: 44px; padding: 0 12px; border: 1px solid #4a3a86; border-radius: 22px; background: #1b1530; color: #efeff1; font-weight: 700; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px; flex: none\">\n        <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 40 40\" aria-hidden=\"true\"><polygon points=\"20,2 36,11 36,29 20,38 4,29 4,11\" fill=\"#ffd23f\"><\u002Fpolygon><\u002Fsvg>\n        My pins {{pinCount}}\n      <\u002Fbutton>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <div style=\"margin: 0 16px; padding: 10px 14px; background: #18181b; border-radius: 12px; flex: none\">\n    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 7px\">\n      <span style=\"font-weight: 700; font-size: 13px\">Hype Train - Level 3<\u002Fspan>\n      <span style=\"font-size: 12px; color: #adadb8\">64% to next level<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"height: 8px; border-radius: 4px; background: #2a2a31; overflow: hidden\">\n      <div style=\"height: 8px; width: 64%; background: linear-gradient(90deg, #7a3ff2, #4fc9ff); border-radius: 4px\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"margin: 12px 16px 0 16px; padding: 14px; background: linear-gradient(135deg, #2a1d52 0%, #1b1530 100%); border: 1px solid #4a3a86; border-radius: 14px; display: flex; flex-direction: column; gap: 10px; flex: none\">\n    <div style=\"display: flex; justify-content: space-between; align-items: center\">\n      <span style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #ffd23f\">BATTLE BOSS - {{cardEyebrow}}<\u002Fspan>\n      <sc-if value=\"{{ pollRunning }}\" hint-placeholder-val=\"{{ false }}\">\n        <span style=\"font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 18px\">{{timeText}}<\u002Fspan>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <span style=\"font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 19px\">{{cardTitle}}<\u002Fspan>\n    <span style=\"font-size: 13px; color: #adadb8\">{{cardSub}}<\u002Fspan>\n    <sc-if value=\"{{ hasPoll }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: #2a2a31\">\n        <div style=\"width: {{pctA}}%; background: #ff7a3d; transition: width 0.4s\"><\u002Fdiv>\n        <div style=\"width: {{pctB}}%; background: #4fc9ff; transition: width 0.4s\"><\u002Fdiv>\n      <\u002Fdiv>\n      <button type=\"button\" sc-camel-on-click=\"{{ openPoll }}\" style=\"width: 100%; min-height: 48px; border: 0; border-radius: 10px; background: {{accent}}; color: #ffffff; font-weight: 700; font-size: 15px; cursor: pointer\">{{cardButton}}<\u002Fbutton>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <div style=\"margin-top: 12px; border-top: 1px solid #26262c; padding: 10px 16px; display: flex; flex-direction: column; gap: 6px; overflow: hidden; flex: 1\">\n    <span style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #adadb8\">STREAM CHAT (MOCK)<\u002Fspan>\n    <sc-for list=\"{{ chatLines }}\" as=\"line\" hint-placeholder-count=\"4\">\n      <div style=\"font-size: 13px\"><span style=\"font-weight: 700; color: {{line.color}}\">{{line.name}}<\u002Fspan><span>: {{line.text}}<\u002Fspan><\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ VIEWER: PIN COLLECTION / PROFILE ============ -->\n<sc-if value=\"{{ isProfile }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position: absolute; inset: 0; display: flex; flex-direction: column; background: radial-gradient(ellipse at 50% 0%, #2a1d52 0%, #0e0e10 55%)\">\n  <div style=\"flex: none; display: flex; align-items: center; gap: 10px; padding: 12px 16px\">\n    <button type=\"button\" aria-label=\"Back to stream\" sc-camel-on-click=\"{{ backToStream }}\" style=\"width: 44px; height: 44px; border: 0; border-radius: 22px; background: #26262c; cursor: pointer; display: flex; align-items: center; justify-content: center; flex: none\">\n      <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#efeff1\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 5 L8 12 L15 19\"><\u002Fpath><\u002Fsvg>\n    <\u002Fbutton>\n    <span style=\"font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 20px\">My pins<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"flex: 1; overflow-y: auto; padding: 0 16px 24px 16px; display: flex; flex-direction: column; gap: 14px\">\n    <div style=\"display: flex; gap: 12px; align-items: center\">\n      <div style=\"width: 52px; height: 52px; border-radius: 26px; background: #2f7d6d; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; color: #ffffff; flex: none\">T<\u002Fdiv>\n      <span style=\"display: flex; flex-direction: column\">\n        <span style=\"font-weight: 700; font-size: 17px\">tidepool_tess<\u002Fspan>\n        <span style=\"font-size: 12px; color: #adadb8\">Demo viewer account<\u002Fspan>\n      <\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px\">\n      <div style=\"background: #18181b; border-radius: 12px; padding: 12px; display: flex; flex-direction: column\">\n        <span style=\"font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 26px\">{{pinCount}}<\u002Fspan>\n        <span style=\"font-size: 12px; color: #adadb8\">Pins collected<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"background: #18181b; border-radius: 12px; padding: 12px; display: flex; flex-direction: column\">\n        <span style=\"font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 26px\">{{pinCount}}<\u002Fspan>\n        <span style=\"font-size: 12px; color: #adadb8\">Wins on record<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding: 12px; border-radius: 12px; border: 1px dashed #4a3a86; font-size: 12px; color: #adadb8\">Twitch profile display: not connected in this prototype. Pins live in this in-app collection. Whether they can also appear on your Twitch account depends on what Twitch's integration supports.<\u002Fdiv>\n\n    <sc-if value=\"{{ noPins }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding: 20px; border-radius: 14px; background: #18181b; text-align: center; display: flex; flex-direction: column; gap: 6px\">\n        <span style=\"font-weight: 700\">No pins yet<\u002Fspan>\n        <span style=\"font-size: 13px; color: #adadb8\">Join the winning team and contribute at least {{minBitsText}} Bits in a poll to earn a winner pin.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-for list=\"{{ pinList }}\" as=\"p\" hint-placeholder-count=\"2\">\n      <div style=\"display: flex; gap: 14px; align-items: center; padding: 14px; border-radius: 14px; background: #18181b; opacity: {{p.opacity}}\">\n        <svg width=\"56\" height=\"56\" sc-camel-view-box=\"0 0 40 40\" aria-hidden=\"true\" style=\"flex: none\">\n          <polygon points=\"20,2 36,11 36,29 20,38 4,29 4,11\" fill=\"{{p.color}}\"><\u002Fpolygon>\n          <sc-if value=\"{{ p.isA }}\" hint-placeholder-val=\"{{ true }}\">\n            <polygon points=\"20,10 29,26 11,26\" fill=\"#0e0e10\"><\u002Fpolygon>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ p.isB }}\" hint-placeholder-val=\"{{ false }}\">\n            <circle cx=\"20\" cy=\"20\" r=\"8\" fill=\"#0e0e10\"><\u002Fcircle>\n          <\u002Fsc-if>\n        <\u002Fsvg>\n        <span style=\"display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1\">\n          <span style=\"font-weight: 700; font-size: 15px\">{{p.title}}<\u002Fspan>\n          <span style=\"font-size: 12px; color: #adadb8\">{{p.detail}}<\u002Fspan>\n          <span style=\"font-size: 12px; color: #efeff1\">{{p.earned}} - {{p.bitsText}}<\u002Fspan>\n          <sc-if value=\"{{ p.hasNote }}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"font-size: 12px; font-weight: 700; color: #ffd36a\">{{p.note}}<\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ STREAMER / MODERATOR CONTROL PANEL ============ -->\n<sc-if value=\"{{ isControls }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position: absolute; inset: 0; display: flex; flex-direction: column; background: #14110a\">\n  <div style=\"flex: none; background: #ffb020; color: #1a1200; padding: 10px 16px 12px 16px; display: flex; align-items: center; gap: 10px\">\n    <button type=\"button\" aria-label=\"Back to stream\" sc-camel-on-click=\"{{ backToStream }}\" style=\"width: 44px; height: 44px; border: 0; border-radius: 22px; background: #1a1200; cursor: pointer; display: flex; align-items: center; justify-content: center; flex: none\">\n      <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#ffb020\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 5 L8 12 L15 19\"><\u002Fpath><\u002Fsvg>\n    <\u002Fbutton>\n    <span style=\"display: flex; flex-direction: column; flex: 1; min-width: 0\">\n      <span style=\"font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 17px\">{{roleLabel}} controls<\u002Fspan>\n      <span style=\"font-size: 12px\">Viewers never see this screen<\u002Fspan>\n    <\u002Fspan>\n    <button type=\"button\" sc-camel-on-click=\"{{ openDemo }}\" style=\"min-height: 44px; padding: 0 8px; border: 0; background: transparent; color: #1a1200; font-size: 12px; font-weight: 700; text-decoration: underline; cursor: pointer; flex: none\">Prototype tools<\u002Fbutton>\n  <\u002Fdiv>\n\n  <div style=\"flex: 1; overflow-y: auto; padding: 14px 16px 24px 16px; display: flex; flex-direction: column; gap: 14px\">\n\n    <div style=\"padding: 12px; border: 1px solid #5a4410; border-radius: 12px; background: #1d1807; font-size: 13px; color: #e9d9aa\">{{permissionText}}<\u002Fdiv>\n\n    <!-- status -->\n    <div style=\"padding: 14px; border-radius: 14px; background: #1d1807; border: 1px solid #5a4410; display: flex; flex-direction: column; gap: 10px\">\n      <div style=\"display: flex; justify-content: space-between; align-items: center; gap: 8px\">\n        <span style=\"font-weight: 700; font-size: 15px\">{{ctlTitle}}<\u002Fspan>\n        <span style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.06em; padding: 4px 8px; border-radius: 10px; background: #ffb020; color: #1a1200; flex: none\">{{phaseLabel}}<\u002Fspan>\n      <\u002Fdiv>\n      <sc-if value=\"{{ hasPoll }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display: flex; justify-content: space-between; align-items: baseline\">\n          <span style=\"font-size: 12px; color: #e9d9aa\">Time remaining<\u002Fspan>\n          <span style=\"font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 26px\">{{timeText}}<\u002Fspan>\n        <\u002Fdiv>\n        <sc-for list=\"{{ teams }}\" as=\"t\" hint-placeholder-count=\"2\">\n          <div style=\"display: flex; flex-direction: column; gap: 4px\">\n            <div style=\"display: flex; justify-content: space-between; font-size: 13px\">\n              <span style=\"font-weight: 700; color: {{t.color}}\">{{t.name}}<\u002Fspan>\n              <span>{{t.scoreText}} pts - {{t.pct}}%<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"height: 8px; border-radius: 4px; background: #2e2610; overflow: hidden\">\n              <div style=\"height: 8px; width: {{t.pct}}%; background: {{t.color}}; transition: width 0.4s\"><\u002Fdiv>\n            <\u002Fdiv>\n            <span style=\"font-size: 12px; color: #d6c690\">{{t.breakdown}}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <span style=\"font-size: 12px; color: #e9d9aa\">Scores count confirmed Bits and rate-limited taps only. Failed, unconfirmed and duplicate Bits events are never counted.<\u002Fspan>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <!-- result: decision needed -->\n    <sc-if value=\"{{ needsDecision }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding: 14px; border-radius: 14px; background: #2a1d07; border: 2px solid #ffb020; display: flex; flex-direction: column; gap: 10px\">\n        <span style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #ffb020\">NO WINNER YET - DECISION NEEDED<\u002Fspan>\n        <span style=\"font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 20px\">{{winText}}<\u002Fspan>\n        <span style=\"font-size: 13px; color: #e9d9aa\">Viewers see a waiting state until the streamer decides. No pins are awarded yet.<\u002Fspan>\n        <sc-if value=\"{{ canDecide }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display: flex; flex-direction: column; gap: 8px\">\n            <button type=\"button\" sc-camel-on-click=\"{{ declareA }}\" style=\"min-height: 46px; border: 0; border-radius: 10px; background: #ff7a3d; color: #0e0e10; font-weight: 700; cursor: pointer\">Declare {{nameA}} the winner<\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ declareB }}\" style=\"min-height: 46px; border: 0; border-radius: 10px; background: #4fc9ff; color: #0e0e10; font-weight: 700; cursor: pointer\">Declare {{nameB}} the winner<\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ declareNone }}\" style=\"min-height: 46px; border: 1px solid #ffb020; border-radius: 10px; background: transparent; color: #ffb020; font-weight: 700; cursor: pointer\">Declare no winner<\u002Fbutton>\n            <sc-if value=\"{{ canOvertime }}\" hint-placeholder-val=\"{{ true }}\">\n              <button type=\"button\" sc-camel-on-click=\"{{ runOvertime }}\" style=\"min-height: 46px; border: 1px solid #ffb020; border-radius: 10px; background: transparent; color: #ffb020; font-weight: 700; cursor: pointer\">Run a tiebreak: {{otText}} of overtime<\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ waitDecision }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"min-height: 46px; border-radius: 10px; background: #2e2610; color: #e9d9aa; font-size: 13px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 10px\">Waiting for the streamer. Moderators cannot decide results.<\u002Fdiv>\n        <\u002Fsc-if>\n        <span style=\"font-size: 12px; color: #e9d9aa\">Tie and no-participation behavior is configurable in the Tweaks panel.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- result: final + override -->\n    <sc-if value=\"{{ settledResult }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding: 14px; border-radius: 14px; background: #1d1807; border: 1px solid #5a4410; display: flex; flex-direction: column; gap: 10px\">\n        <span style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #e9d9aa\">FINAL RESULT<\u002Fspan>\n        <span style=\"font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 20px; color: {{winColor}}\">{{winText}}<\u002Fspan>\n        <sc-if value=\"{{ overridden }}\" hint-placeholder-val=\"{{ false }}\">\n          <span style=\"font-size: 12px; font-weight: 700; color: #ffd36a\">Result overridden by the streamer. Viewers can see this.<\u002Fspan>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ canOverride }}\" hint-placeholder-val=\"{{ true }}\">\n          <button type=\"button\" sc-camel-on-click=\"{{ openOverride }}\" style=\"min-height: 44px; border: 1px solid #ff6b6b; border-radius: 10px; background: transparent; color: #ff8f8f; font-weight: 700; font-size: 13px; cursor: pointer\">Override result (rare)<\u002Fbutton>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ modOverrideNote }}\" hint-placeholder-val=\"{{ false }}\">\n          <span style=\"font-size: 12px; color: #e9d9aa\">Only the streamer can override a result.<\u002Fspan>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ overrideOpen }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding: 12px; border: 1px solid #ff6b6b; border-radius: 12px; background: #2a1212; display: flex; flex-direction: column; gap: 8px\">\n            <span style=\"font-weight: 700; font-size: 13px; color: #ffb3b3\">OVERRIDE: use only when the result is wrong<\u002Fspan>\n            <span style=\"font-size: 12px; color: #f2c9c9\">This is recorded in the action log and shown to viewers. Pins already awarded for this poll are revoked and re-assigned to the new result.<\u002Fspan>\n            <button type=\"button\" sc-camel-on-click=\"{{ overrideA }}\" style=\"min-height: 44px; border: 0; border-radius: 10px; background: #ff7a3d; color: #0e0e10; font-weight: 700; cursor: pointer\">Set {{nameA}} as winner<\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ overrideB }}\" style=\"min-height: 44px; border: 0; border-radius: 10px; background: #4fc9ff; color: #0e0e10; font-weight: 700; cursor: pointer\">Set {{nameB}} as winner<\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ overrideNone }}\" style=\"min-height: 44px; border: 1px solid #ff6b6b; border-radius: 10px; background: transparent; color: #ff8f8f; font-weight: 700; cursor: pointer\">Set no winner<\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ closeOverride }}\" style=\"min-height: 44px; border: 1px solid #5a4410; border-radius: 10px; background: transparent; color: #efeff1; font-weight: 700; cursor: pointer\">Keep the current result<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- running poll controls -->\n    <sc-if value=\"{{ isRunning }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display: flex; flex-direction: column; gap: 10px\">\n        <span style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #e9d9aa\">MANAGE THIS POLL<\u002Fspan>\n        <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px\">\n          <sc-if value=\"{{ pollLive }}\" hint-placeholder-val=\"{{ true }}\">\n            <button type=\"button\" sc-camel-on-click=\"{{ pausePoll }}\" style=\"min-height: 48px; border: 0; border-radius: 10px; background: #ffb020; color: #1a1200; font-weight: 700; font-size: 14px; cursor: pointer\">Pause<\u002Fbutton>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ pollPaused }}\" hint-placeholder-val=\"{{ false }}\">\n            <button type=\"button\" sc-camel-on-click=\"{{ resumePoll }}\" style=\"min-height: 48px; border: 0; border-radius: 10px; background: #ffb020; color: #1a1200; font-weight: 700; font-size: 14px; cursor: pointer\">Resume<\u002Fbutton>\n          <\u002Fsc-if>\n          <button type=\"button\" sc-camel-on-click=\"{{ restartPoll }}\" style=\"min-height: 48px; border: 1px solid #ffb020; border-radius: 10px; background: transparent; color: #ffb020; font-weight: 700; font-size: 14px; cursor: pointer\">Restart timer<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ startEdit }}\" style=\"min-height: 48px; border: 1px solid #ffb020; border-radius: 10px; background: transparent; color: #ffb020; font-weight: 700; font-size: 14px; cursor: pointer\">Edit choices<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ askCancel }}\" style=\"min-height: 48px; border: 1px solid #ff6b6b; border-radius: 10px; background: transparent; color: #ff8f8f; font-weight: 700; font-size: 14px; cursor: pointer\">Cancel poll<\u002Fbutton>\n        <\u002Fdiv>\n        <span style=\"font-size: 12px; color: #e9d9aa\">Restart resets the clock. Confirmed scores and team locks stay.<\u002Fspan>\n\n        <sc-if value=\"{{ editing }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding: 12px; border: 1px solid #5a4410; border-radius: 12px; background: #1d1807; display: flex; flex-direction: column; gap: 10px\">\n            <label for=\"editA\" style=\"font-size: 12px; color: #e9d9aa\">Choice A<\u002Flabel>\n            <input id=\"editA\" type=\"text\" value=\"{{editA}}\" sc-camel-on-input=\"{{ setEditA }}\" style=\"min-height: 44px; border: 1px solid #5a4410; border-radius: 8px; background: #0e0c05; color: #efeff1; padding: 0 12px; font-size: 15px\">\n            <label for=\"editB\" style=\"font-size: 12px; color: #e9d9aa\">Choice B<\u002Flabel>\n            <input id=\"editB\" type=\"text\" value=\"{{editB}}\" sc-camel-on-input=\"{{ setEditB }}\" style=\"min-height: 44px; border: 1px solid #5a4410; border-radius: 8px; background: #0e0c05; color: #efeff1; padding: 0 12px; font-size: 15px\">\n            <sc-if value=\"{{ editError }}\" hint-placeholder-val=\"{{ false }}\">\n              <span style=\"font-size: 12px; color: #ff8f8f\">{{editErrorText}}<\u002Fspan>\n            <\u002Fsc-if>\n            <div style=\"display: flex; gap: 10px\">\n              <button type=\"button\" sc-camel-on-click=\"{{ saveEdit }}\" style=\"flex: 1; min-height: 44px; border: 0; border-radius: 10px; background: #ffb020; color: #1a1200; font-weight: 700; cursor: pointer\">Save<\u002Fbutton>\n              <button type=\"button\" sc-camel-on-click=\"{{ stopEdit }}\" style=\"flex: 1; min-height: 44px; border: 1px solid #5a4410; border-radius: 10px; background: transparent; color: #efeff1; font-weight: 700; cursor: pointer\">Discard<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ confirmCancel }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding: 12px; border: 1px solid #ff6b6b; border-radius: 12px; background: #2a1212; display: flex; flex-direction: column; gap: 10px\">\n            <span style=\"font-size: 13px\">Cancel this poll? Viewers will see that it was cancelled, contributions stop and no pins are awarded.<\u002Fspan>\n            <div style=\"display: flex; gap: 10px\">\n              <button type=\"button\" sc-camel-on-click=\"{{ doCancel }}\" style=\"flex: 1; min-height: 44px; border: 0; border-radius: 10px; background: #ff6b6b; color: #1a0505; font-weight: 700; cursor: pointer\">Yes, cancel poll<\u002Fbutton>\n              <button type=\"button\" sc-camel-on-click=\"{{ keepPoll }}\" style=\"flex: 1; min-height: 44px; border: 1px solid #5a4410; border-radius: 10px; background: transparent; color: #efeff1; font-weight: 700; cursor: pointer\">Keep running<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- next poll: queued -->\n    <sc-if value=\"{{ hasQueue }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding: 14px; border-radius: 14px; background: #1d1807; border: 1px solid #ffb020; display: flex; flex-direction: column; gap: 10px\">\n        <span style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #ffb020\">QUEUED BY THE STREAMER<\u002Fspan>\n        <span style=\"font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 18px\">{{queueText}}<\u002Fspan>\n        <sc-if value=\"{{ canLaunch }}\" hint-placeholder-val=\"{{ true }}\">\n          <button type=\"button\" sc-camel-on-click=\"{{ launchQueue }}\" style=\"width: 100%; min-height: 48px; border: 0; border-radius: 10px; background: #ffb020; color: #1a1200; font-weight: 700; font-size: 15px; cursor: pointer\">Launch queued poll<\u002Fbutton>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ cannotLaunch }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"min-height: 48px; border-radius: 10px; background: #2e2610; color: #e9d9aa; font-size: 13px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 10px\">{{queueBlockText}}<\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ isStreamer }}\" hint-placeholder-val=\"{{ true }}\">\n          <button type=\"button\" sc-camel-on-click=\"{{ clearQueue }}\" style=\"min-height: 44px; border: 1px solid #5a4410; border-radius: 10px; background: transparent; color: #efeff1; font-weight: 700; font-size: 13px; cursor: pointer\">Remove from queue<\u002Fbutton>\n        <\u002Fsc-if>\n        <span style=\"font-size: 12px; color: #e9d9aa\">Polls never launch on their own. Someone has to press launch.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ noQueueForMod }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding: 14px; border-radius: 14px; background: #1d1807; border: 1px dashed #5a4410; display: flex; flex-direction: column; gap: 6px\">\n        <span style=\"font-weight: 700\">No poll queued<\u002Fspan>\n        <span style=\"font-size: 13px; color: #e9d9aa\">Moderators cannot create polls. Ask the streamer to queue one, then you can launch it here.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- streamer: create -->\n    <sc-if value=\"{{ isStreamer }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"padding: 14px; border-radius: 14px; background: #1d1807; border: 1px solid #5a4410; display: flex; flex-direction: column; gap: 10px\">\n        <span style=\"font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 17px\">{{createTitle}}<\u002Fspan>\n        <label for=\"draftA\" style=\"font-size: 12px; color: #e9d9aa\">Choice A (orange team)<\u002Flabel>\n        <input id=\"draftA\" type=\"text\" value=\"{{draftA}}\" sc-camel-on-input=\"{{ setDraftA }}\" style=\"min-height: 44px; border: 1px solid #5a4410; border-radius: 8px; background: #0e0c05; color: #efeff1; padding: 0 12px; font-size: 15px\">\n        <label for=\"draftB\" style=\"font-size: 12px; color: #e9d9aa\">Choice B (blue team)<\u002Flabel>\n        <input id=\"draftB\" type=\"text\" value=\"{{draftB}}\" sc-camel-on-input=\"{{ setDraftB }}\" style=\"min-height: 44px; border: 1px solid #5a4410; border-radius: 8px; background: #0e0c05; color: #efeff1; padding: 0 12px; font-size: 15px\">\n        <span style=\"font-size: 12px; color: #e9d9aa\">Suggestions<\u002Fspan>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n          <sc-for list=\"{{ suggestions }}\" as=\"sg\" hint-placeholder-count=\"3\">\n            <button type=\"button\" sc-camel-on-click=\"{{ sg.pick }}\" style=\"min-height: 44px; padding: 0 12px; border: 1px solid #5a4410; border-radius: 22px; background: transparent; color: #efeff1; font-size: 13px; cursor: pointer\">{{sg.label}}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{ draftError }}\" hint-placeholder-val=\"{{ false }}\">\n          <span style=\"font-size: 12px; color: #ff8f8f\">{{draftErrorText}}<\u002Fspan>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ canLaunchDraft }}\" hint-placeholder-val=\"{{ true }}\">\n          <button type=\"button\" sc-camel-on-click=\"{{ launchDraft }}\" style=\"width: 100%; min-height: 50px; border: 0; border-radius: 10px; background: #ffb020; color: #1a1200; font-weight: 700; font-size: 15px; cursor: pointer\">Launch poll ({{pollLenText}})<\u002Fbutton>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ cannotLaunchDraft }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"min-height: 50px; border-radius: 10px; background: #2e2610; color: #e9d9aa; font-size: 13px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 10px\">{{launchBlockText}}<\u002Fdiv>\n        <\u002Fsc-if>\n        <button type=\"button\" sc-camel-on-click=\"{{ queueDraft }}\" style=\"min-height: 46px; border: 1px solid #ffb020; border-radius: 10px; background: transparent; color: #ffb020; font-weight: 700; font-size: 14px; cursor: pointer\">Save as next poll<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- rules -->\n    <div style=\"padding: 14px; border-radius: 14px; background: #1d1807; border: 1px solid #5a4410; display: flex; flex-direction: column; gap: 8px\">\n      <span style=\"font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 16px\">Rules for this stream<\u002Fspan>\n      <span style=\"font-size: 13px\">{{ruleScore}}<\u002Fspan>\n      <span style=\"font-size: 13px\">{{ruleTap}}<\u002Fspan>\n      <span style=\"font-size: 13px\">{{ruleTie}}<\u002Fspan>\n      <span style=\"font-size: 13px\">{{ruleNone}}<\u002Fspan>\n      <div style=\"display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 4px\">\n        <span style=\"font-size: 13px\">Winner pin needs at least <span style=\"font-weight: 700\">{{minBitsText}} Bits<\u002Fspan> (not final)<\u002Fspan>\n        <sc-if value=\"{{ isStreamer }}\" hint-placeholder-val=\"{{ true }}\">\n          <span style=\"display: flex; gap: 6px; flex: none\">\n            <button type=\"button\" aria-label=\"Lower pin threshold by 50 Bits\" sc-camel-on-click=\"{{ minDown }}\" style=\"width: 44px; height: 44px; border: 1px solid #ffb020; border-radius: 22px; background: transparent; color: #ffb020; font-weight: 800; font-size: 20px; cursor: pointer\">-<\u002Fbutton>\n            <button type=\"button\" aria-label=\"Raise pin threshold by 50 Bits\" sc-camel-on-click=\"{{ minUp }}\" style=\"width: 44px; height: 44px; border: 1px solid #ffb020; border-radius: 22px; background: transparent; color: #ffb020; font-weight: 800; font-size: 20px; cursor: pointer\">+<\u002Fbutton>\n          <\u002Fspan>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <span style=\"font-size: 12px; color: #d6c690\">Scoring ratio, tap limits and tie behavior are set in the Tweaks panel.<\u002Fspan>\n    <\u002Fdiv>\n\n    <!-- log -->\n    <div style=\"display: flex; flex-direction: column; gap: 6px\">\n      <span style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #e9d9aa\">ACTION LOG<\u002Fspan>\n      <sc-for list=\"{{ logItems }}\" as=\"l\" hint-placeholder-count=\"3\">\n        <span style=\"font-size: 12px; color: #d6c690\">{{l.text}}<\u002Fspan>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ VIEWER: POLL POP-UP ============ -->\n<sc-if value=\"{{ pollOpen }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position: absolute; inset: 0; background: rgba(0,0,0,0.6); display: flex; flex-direction: column; justify-content: flex-end\">\n  <div style=\"background: #18181b; border-radius: 22px 22px 0 0; max-height: 790px; overflow-y: auto; padding: 18px 18px 22px 18px; display: flex; flex-direction: column; gap: 14px\">\n\n    <div style=\"display: flex; justify-content: space-between; align-items: center\">\n      <span style=\"display: flex; flex-direction: column; gap: 2px\">\n        <span style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #ffd23f\">BATTLE BOSS - POLL {{pollNo}}<\u002Fspan>\n        <span style=\"font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 20px\">What are we playing next?<\u002Fspan>\n      <\u002Fspan>\n      <button type=\"button\" aria-label=\"Close poll\" sc-camel-on-click=\"{{ closePoll }}\" style=\"width: 44px; height: 44px; border: 0; border-radius: 22px; background: #26262c; cursor: pointer; display: flex; align-items: center; justify-content: center; flex: none\">\n        <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#efeff1\" stroke-width=\"2.4\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M6 6 L18 18 M18 6 L6 18\"><\u002Fpath><\u002Fsvg>\n      <\u002Fbutton>\n    <\u002Fdiv>\n\n    <div style=\"display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-radius: 12px; background: {{bannerBg}}\">\n      <span style=\"font-size: 13px; font-weight: 700; color: {{bannerColor}}\">{{bannerText}}<\u002Fspan>\n      <span style=\"font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 24px\">{{timeText}}<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"height: 6px; border-radius: 3px; background: #2a2a31; overflow: hidden; margin-top: -6px\">\n      <div style=\"height: 6px; width: {{timePct}}%; background: {{accent}}; transition: width 1s linear\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ hasNotice }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"font-size: 13px; padding: 10px 12px; border-radius: 10px; background: #3a2f0d; color: #ffd36a\">{{notice}}<\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ showResult }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding: 16px; border-radius: 14px; background: #1b1530; border: 1px solid #4a3a86; text-align: center; display: flex; flex-direction: column; gap: 6px\">\n        <span style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #ffd23f\">POLL CLOSED - RESULT<\u002Fspan>\n        <span style=\"font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 28px; color: {{winColor}}\">{{winText}}<\u002Fspan>\n        <span style=\"font-size: 13px; color: #efeff1\">{{resultSub}}<\u002Fspan>\n        <sc-if value=\"{{ overridden }}\" hint-placeholder-val=\"{{ false }}\">\n          <span style=\"font-size: 12px; font-weight: 700; color: #ffd36a\">Result overridden by the streamer<\u002Fspan>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ showViewerResult }}\" hint-placeholder-val=\"{{ false }}\">\n          <span style=\"font-size: 13px; color: #efeff1\">{{yourResult}}<\u002Fspan>\n          <span style=\"font-size: 13px; font-weight: 700; color: #ffd23f\">{{pinStatus}}<\u002Fspan>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ showPinButton }}\" hint-placeholder-val=\"{{ false }}\">\n          <button type=\"button\" sc-camel-on-click=\"{{ openProfile }}\" style=\"min-height: 46px; border: 0; border-radius: 10px; background: #ffd23f; color: #1a1200; font-weight: 700; font-size: 14px; cursor: pointer\">View my pins<\u002Fbutton>\n        <\u002Fsc-if>\n        <span style=\"font-size: 12px; color: #adadb8\">The streamer or a moderator launches the next poll.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-for list=\"{{ teams }}\" as=\"t\" hint-placeholder-count=\"2\">\n      <div style=\"border-radius: 14px; padding: 14px; background: {{t.bg}}; border: 2px solid {{t.border}}; opacity: {{t.opacity}}; display: flex; flex-direction: column; gap: 10px\">\n        <div style=\"display: flex; align-items: center; gap: 12px\">\n          <span style=\"width: 40px; height: 40px; border-radius: 10px; background: {{t.color}}; display: flex; align-items: center; justify-content: center; flex: none\">\n            <sc-if value=\"{{ t.isA }}\" hint-placeholder-val=\"{{ true }}\">\n              <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"#0e0e10\" aria-hidden=\"true\"><path d=\"M12 3 L22 21 L2 21 Z\"><\u002Fpath><\u002Fsvg>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ t.isB }}\" hint-placeholder-val=\"{{ false }}\">\n              <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"#0e0e10\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><\u002Fsvg>\n            <\u002Fsc-if>\n          <\u002Fspan>\n          <span style=\"display: flex; flex-direction: column; flex: 1; min-width: 0\">\n            <span style=\"font-weight: 700; font-size: 17px\">{{t.name}}<\u002Fspan>\n            <span style=\"font-size: 12px; color: #adadb8\">Team {{t.label}}<\u002Fspan>\n          <\u002Fspan>\n          <sc-if value=\"{{ t.isMine }}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: #0e0e10; background: {{t.color}}; padding: 5px 10px; border-radius: 12px\">\n              <svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"#0e0e10\" aria-hidden=\"true\"><path d=\"M7 10 V7 a5 5 0 0 1 10 0 V10 H19 V22 H5 V10 Z\"><\u002Fpath><\u002Fsvg>\n              Your team - locked\n            <\u002Fspan>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ t.isWinner }}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"font-size: 12px; font-weight: 700; color: #0e0e10; background: #ffd23f; padding: 5px 10px; border-radius: 12px\">Winner<\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"display: flex; justify-content: space-between; align-items: baseline\">\n          <span style=\"font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 24px\">{{t.scoreText}} <span style=\"font-size: 13px; font-weight: 500; color: #adadb8\">pts<\u002Fspan><\u002Fspan>\n          <span style=\"font-weight: 700; font-size: 18px; color: {{t.color}}\">{{t.pct}}%<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"height: 10px; border-radius: 5px; background: #2a2a31; overflow: hidden\">\n          <div style=\"height: 10px; width: {{t.pct}}%; background: {{t.color}}; border-radius: 5px; transition: width 0.4s\"><\u002Fdiv>\n        <\u002Fdiv>\n        <span style=\"font-size: 12px; color: #adadb8\">{{t.breakdown}}<\u002Fspan>\n        <sc-if value=\"{{ t.canJoin }}\" hint-placeholder-val=\"{{ true }}\">\n          <button type=\"button\" sc-camel-on-click=\"{{ t.join }}\" style=\"width: 100%; min-height: 46px; border: 0; border-radius: 10px; background: {{t.color}}; color: #0e0e10; font-weight: 700; font-size: 15px; cursor: pointer\">Join Team {{t.label}}<\u002Fbutton>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ t.lockedOut }}\" hint-placeholder-val=\"{{ false }}\">\n          <span style=\"font-size: 12px; color: #adadb8\">Locked. You can not switch teams during this poll.<\u002Fspan>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n\n    <sc-if value=\"{{ showPickHint }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"font-size: 13px; color: #efeff1; padding: 10px 12px; border-radius: 10px; background: #26262c\">Pick a side. Your choice locks the moment you tap and can not be changed in this poll.<\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ showStaffNote }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"font-size: 13px; padding: 10px 12px; border-radius: 10px; background: #26262c\">Read-only view. {{roleLabel}} accounts manage polls from the controls screen.<\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- scoring impact -->\n    <sc-if value=\"{{ showImpact }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"padding: 14px; border-radius: 14px; background: #0e0e10; border: 1px solid #2a2a31; display: flex; flex-direction: column; gap: 10px\">\n        <span style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #adadb8\">HOW SCORING WORKS<\u002Fspan>\n        <div style=\"display: flex; flex-direction: column; gap: 5px\">\n          <div style=\"display: flex; justify-content: space-between; align-items: center; gap: 8px\">\n            <span style=\"display: flex; align-items: center; gap: 8px; font-size: 13px\">\n              <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"#ffd23f\" aria-hidden=\"true\"><path d=\"M12 2 L21 9 L12 22 L3 9 Z\"><\u002Fpath><\u002Fsvg>\n              <span style=\"font-weight: 700\">Bits<\u002Fspan><span style=\"color: #adadb8\">{{bitsRateText}}<\u002Fspan>\n            <\u002Fspan>\n            <span style=\"font-weight: 700; color: #ffd23f; font-size: 13px\">{{impactBitsText}}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"height: 10px; border-radius: 5px; background: #2a2a31; overflow: hidden\"><div style=\"height: 10px; width: 100%; background: #ffd23f; border-radius: 5px\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 5px\">\n          <div style=\"display: flex; justify-content: space-between; align-items: center; gap: 8px\">\n            <span style=\"display: flex; align-items: center; gap: 8px; font-size: 13px\">\n              <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#9be08a\" stroke-width=\"2.2\" stroke-linecap=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"3\"><\u002Fcircle><circle cx=\"12\" cy=\"12\" r=\"8\"><\u002Fcircle><\u002Fsvg>\n              <span style=\"font-weight: 700\">Free tap<\u002Fspan><span style=\"color: #adadb8\">{{tapRateText}}<\u002Fspan>\n            <\u002Fspan>\n            <span style=\"font-weight: 700; color: #9be08a; font-size: 13px\">{{impactTapText}}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"height: 10px; border-radius: 5px; background: #2a2a31; overflow: hidden\"><div style=\"height: 10px; width: {{tapBarW}}%; background: #9be08a; border-radius: 5px\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <span style=\"font-size: 12px; color: #adadb8\">Bars compare your selected Bits amount with a single tap. Bits move the score far more than taps do.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- free tap -->\n    <sc-if value=\"{{ showParticipate }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding: 14px; border-radius: 14px; background: #0e0e10; border: 1px solid #2a2a31; display: flex; flex-direction: column; gap: 10px\">\n        <div style=\"display: flex; justify-content: space-between; align-items: baseline\">\n          <span style=\"font-weight: 700; font-size: 15px\">Tap for {{myTeamName}} (free)<\u002Fspan>\n          <span style=\"font-size: 12px; color: #adadb8\">{{myTapPts}} / {{maxTap}} tap points<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"height: 6px; border-radius: 3px; background: #2a2a31; overflow: hidden\"><div style=\"height: 6px; width: {{tapProgPct}}%; background: #9be08a; border-radius: 3px\"><\u002Fdiv><\u002Fdiv>\n        <sc-if value=\"{{ tapReady }}\" hint-placeholder-val=\"{{ true }}\">\n          <button type=\"button\" sc-camel-on-click=\"{{ tap }}\" style=\"width: 100%; min-height: 56px; border: 0; border-radius: 12px; background: {{myTeamColor}}; color: #0e0e10; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 18px; cursor: pointer\">Tap +{{tapPtsText}} pt<\u002Fbutton>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ tapWait }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"width: 100%; min-height: 56px; border-radius: 12px; background: #26262c; color: #adadb8; font-weight: 700; display: flex; align-items: center; justify-content: center\">Nice. One tap every {{coolText}}<\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ tapMaxed }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"width: 100%; min-height: 56px; border-radius: 12px; background: #26262c; color: #adadb8; font-weight: 700; display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 10px\">Tap limit reached for this poll. Bits still count.<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <!-- bits -->\n      <div style=\"display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 14px; background: #0e0e10; border: 1px solid #2a2a31\">\n        <div style=\"display: flex; justify-content: space-between; align-items: baseline\">\n          <span style=\"font-weight: 700; font-size: 15px\">Contribute Bits to {{myTeamName}}<\u002Fspan>\n          <span style=\"font-size: 12px; color: #adadb8\">No limit per viewer<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px\">\n          <sc-for list=\"{{ packs }}\" as=\"p\" hint-placeholder-count=\"5\">\n            <button type=\"button\" sc-camel-on-click=\"{{ p.pick }}\" style=\"grid-column: {{p.span}}; min-height: 46px; border-radius: 10px; background: {{p.bg}}; border: 2px solid {{p.border}}; color: #efeff1; font-weight: 700; font-size: 14px; cursor: pointer\">{{p.label}}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{ showCustom }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display: flex; flex-direction: column; gap: 6px\">\n            <label for=\"customAmt\" style=\"font-size: 12px; color: #adadb8\">Custom amount in Bits<\u002Flabel>\n            <input id=\"customAmt\" type=\"text\" inputmode=\"numeric\" value=\"{{customText}}\" sc-camel-on-input=\"{{ setCustom }}\" placeholder=\"Enter a whole number\" style=\"min-height: 46px; border: 2px solid #35353d; border-radius: 10px; background: #18181b; color: #efeff1; padding: 0 12px; font-size: 16px\">\n            <sc-if value=\"{{ customError }}\" hint-placeholder-val=\"{{ false }}\">\n              <span style=\"font-size: 12px; color: #ff8f8f\">Enter at least 1 Bit.<\u002Fspan>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <button type=\"button\" sc-camel-on-click=\"{{ openBits }}\" style=\"width: 100%; min-height: 50px; border: 0; border-radius: 12px; background: {{accent}}; color: #ffffff; font-weight: 700; font-size: 15px; cursor: pointer\">Contribute {{packLabel}} Bits (+{{impactPtsText}} pts)<\u002Fbutton>\n        <div style=\"display: flex; flex-direction: column; gap: 5px\">\n          <span style=\"font-size: 12px; color: #efeff1\">Winner pin: contribute at least {{minBitsText}} Bits on the winning team. You are at {{myBitsText}}.<\u002Fspan>\n          <div style=\"height: 6px; border-radius: 3px; background: #2a2a31; overflow: hidden\"><div style=\"height: 6px; width: {{pinPct}}%; background: #ffd23f; border-radius: 3px\"><\u002Fdiv><\u002Fdiv>\n          <span style=\"font-size: 12px; color: #adadb8\">The score only changes after Twitch confirms each contribution. Taps do not count toward the pin.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ showClosedNote }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"font-size: 13px; color: #adadb8; text-align: center\">Contributions and taps are closed. {{closedExtra}}<\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ showFeed }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display: flex; flex-direction: column; gap: 6px\">\n        <span style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #adadb8\">CONFIRMED CONTRIBUTIONS (MOCK)<\u002Fspan>\n        <sc-for list=\"{{ feedItems }}\" as=\"f\" hint-placeholder-count=\"3\">\n          <div style=\"display: flex; gap: 8px; align-items: center; font-size: 13px\">\n            <span style=\"width: 8px; height: 8px; border-radius: 4px; background: {{f.color}}; flex: none\"><\u002Fspan>\n            <span><span style=\"font-weight: 700\">{{f.name}}<\u002Fspan> {{f.text}}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ OVERLAY: SIGN-IN ============ -->\n<sc-if value=\"{{ showSignin }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position: absolute; inset: 0; background: rgba(0,0,0,0.7); display: flex; flex-direction: column; justify-content: flex-end\">\n  <div style=\"background: #18181b; border-radius: 22px 22px 0 0; padding: 22px 20px 24px 20px; display: flex; flex-direction: column; gap: 14px\">\n    <div style=\"display: flex; justify-content: space-between; align-items: flex-start\">\n      <span style=\"display: flex; flex-direction: column; gap: 4px\">\n        <span style=\"font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 22px\">Sign in to take part<\u002Fspan>\n        <span style=\"font-size: 13px; color: #adadb8\">Viewers sign in with Twitch to pick a team, tap and contribute Bits.<\u002Fspan>\n      <\u002Fspan>\n      <button type=\"button\" aria-label=\"Close\" sc-camel-on-click=\"{{ closeOverlay }}\" style=\"width: 44px; height: 44px; border: 0; border-radius: 22px; background: #26262c; cursor: pointer; display: flex; align-items: center; justify-content: center; flex: none\">\n        <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#efeff1\" stroke-width=\"2.4\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M6 6 L18 18 M18 6 L6 18\"><\u002Fpath><\u002Fsvg>\n      <\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"background: #0e0e10; border-radius: 12px; padding: 12px; display: flex; gap: 12px; align-items: center\">\n      <div style=\"width: 40px; height: 40px; border-radius: 20px; background: #2f7d6d; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #ffffff\">T<\u002Fdiv>\n      <span style=\"display: flex; flex-direction: column\">\n        <span style=\"font-weight: 700\">tidepool_tess<\u002Fspan>\n        <span style=\"font-size: 12px; color: #adadb8\">Demo viewer account<\u002Fspan>\n      <\u002Fspan>\n    <\u002Fdiv>\n    <sc-if value=\"{{ idleSignin }}\" hint-placeholder-val=\"{{ true }}\">\n      <button type=\"button\" sc-camel-on-click=\"{{ signIn }}\" style=\"width: 100%; min-height: 52px; border: 0; border-radius: 12px; background: {{accent}}; color: #ffffff; font-weight: 700; font-size: 16px; cursor: pointer\">Continue with Twitch (simulated)<\u002Fbutton>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ signingIn }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"width: 100%; min-height: 52px; border-radius: 12px; background: #26262c; color: #adadb8; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center\">Connecting...<\u002Fdiv>\n    <\u002Fsc-if>\n    <div style=\"text-align: center; font-size: 12px; color: #adadb8\">Prototype only. No real Twitch sign-in happens here.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ OVERLAY: BITS (SIMULATED NATIVE FLOW) ============ -->\n<sc-if value=\"{{ showBits }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position: absolute; inset: 0; background: rgba(0,0,0,0.75); display: flex; flex-direction: column; justify-content: flex-end\">\n  <div style=\"background: #1f1f23; border-radius: 22px 22px 0 0; padding: 20px 20px 24px 20px; display: flex; flex-direction: column; gap: 14px\">\n    <div style=\"display: flex; justify-content: space-between; align-items: flex-start\">\n      <span style=\"display: flex; flex-direction: column; gap: 4px\">\n        <span style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #adadb8\">STAND-IN FOR TWITCH'S NATIVE BITS FLOW<\u002Fspan>\n        <span style=\"font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 22px\">Contribute Bits<\u002Fspan>\n      <\u002Fspan>\n      <sc-if value=\"{{ bitsCanClose }}\" hint-placeholder-val=\"{{ true }}\">\n        <button type=\"button\" aria-label=\"Close\" sc-camel-on-click=\"{{ closeOverlay }}\" style=\"width: 44px; height: 44px; border: 0; border-radius: 22px; background: #2e2e34; cursor: pointer; display: flex; align-items: center; justify-content: center; flex: none\">\n          <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#efeff1\" stroke-width=\"2.4\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M6 6 L18 18 M18 6 L6 18\"><\u002Fpath><\u002Fsvg>\n        <\u002Fbutton>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"background: #0e0e10; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px\">\n      <div style=\"display: flex; justify-content: space-between\"><span style=\"color: #adadb8\">Team<\u002Fspan><span style=\"font-weight: 700; color: {{myTeamColor}}\">{{myTeamName}}<\u002Fspan><\u002Fdiv>\n      <div style=\"display: flex; justify-content: space-between\"><span style=\"color: #adadb8\">Amount<\u002Fspan><span style=\"font-weight: 700\">{{packLabel}} Bits<\u002Fspan><\u002Fdiv>\n      <div style=\"display: flex; justify-content: space-between\"><span style=\"color: #adadb8\">Score once confirmed<\u002Fspan><span style=\"font-weight: 700\">+{{impactPtsText}} pts<\u002Fspan><\u002Fdiv>\n      <div style=\"display: flex; justify-content: space-between\"><span style=\"color: #adadb8\">Balance<\u002Fspan><span style=\"font-weight: 700\">{{balanceText}} Bits<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ bitsReview }}\" hint-placeholder-val=\"{{ true }}\">\n      <sc-if value=\"{{ canAfford }}\" hint-placeholder-val=\"{{ true }}\">\n        <button type=\"button\" sc-camel-on-click=\"{{ confirmBits }}\" style=\"width: 100%; min-height: 52px; border: 0; border-radius: 12px; background: {{accent}}; color: #ffffff; font-weight: 700; font-size: 16px; cursor: pointer\">Confirm {{packLabel}} Bits<\u002Fbutton>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ cannotAfford }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size: 13px; color: #ff8f8f\">{{affordMsg}}<\u002Fdiv>\n        <button type=\"button\" sc-camel-on-click=\"{{ addBits }}\" style=\"width: 100%; min-height: 50px; border: 1px solid #4a3a86; border-radius: 12px; background: transparent; color: #efeff1; font-weight: 700; font-size: 15px; cursor: pointer\">Add 5,000 Bits (simulated)<\u002Fbutton>\n      <\u002Fsc-if>\n      <div style=\"font-size: 12px; color: #adadb8; text-align: center\">The score does not change until the contribution is confirmed.<\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ bitsPending }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"min-height: 52px; border-radius: 12px; background: #2e2e34; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 700\">\n        <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#efeff1\" stroke-width=\"3\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 3 a9 9 0 1 0 9 9\" opacity=\"0.8\"><\u002Fpath><\u002Fsvg>\n        Waiting for confirmation...\n      <\u002Fdiv>\n      <div style=\"font-size: 12px; color: #adadb8; text-align: center\">Not counted yet. Keep this open.<\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ bitsOk }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding: 12px; border-radius: 12px; background: #12301f; color: #8be5ae; font-weight: 700; text-align: center\">Confirmed. Your Bits are now in the score.<\u002Fdiv>\n      <button type=\"button\" sc-camel-on-click=\"{{ closeOverlay }}\" style=\"width: 100%; min-height: 50px; border: 0; border-radius: 12px; background: {{accent}}; color: #ffffff; font-weight: 700; font-size: 16px; cursor: pointer\">Back to poll<\u002Fbutton>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ bitsFail }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding: 12px; border-radius: 12px; background: #3a1616; color: #ffb3b3; font-size: 13px\">{{bitsMsg}}<\u002Fdiv>\n      <div style=\"display: flex; gap: 10px\">\n        <button type=\"button\" sc-camel-on-click=\"{{ retryBits }}\" style=\"flex: 1; min-height: 50px; border: 0; border-radius: 12px; background: {{accent}}; color: #ffffff; font-weight: 700; cursor: pointer\">Try again<\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ closeOverlay }}\" style=\"flex: 1; min-height: 50px; border: 1px solid #4a3a86; border-radius: 12px; background: transparent; color: #efeff1; font-weight: 700; cursor: pointer\">Close<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ OVERLAY: PROTOTYPE TOOLS ============ -->\n<sc-if value=\"{{ showDemo }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position: absolute; inset: 0; background: rgba(0,0,0,0.7); display: flex; flex-direction: column; justify-content: flex-end\">\n  <div style=\"background: #f4f1ea; color: #1b1a17; border-radius: 22px 22px 0 0; max-height: 800px; overflow-y: auto; padding: 18px 20px 22px 20px; display: flex; flex-direction: column; gap: 10px\">\n    <div style=\"display: flex; justify-content: space-between; align-items: center\">\n      <span style=\"font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 20px\">Prototype tools<\u002Fspan>\n      <button type=\"button\" aria-label=\"Close\" sc-camel-on-click=\"{{ closeOverlay }}\" style=\"width: 44px; height: 44px; border: 0; border-radius: 22px; background: #dcd7cb; cursor: pointer; display: flex; align-items: center; justify-content: center\">\n        <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1b1a17\" stroke-width=\"2.4\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M6 6 L18 18 M18 6 L6 18\"><\u002Fpath><\u002Fsvg>\n      <\u002Fbutton>\n    <\u002Fdiv>\n    <span style=\"font-size: 13px; color: #4a463d\">Review aids only. These are not part of the product.<\u002Fspan>\n    <span style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.06em\">VIEW AS<\u002Fspan>\n    <div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px\">\n      <button type=\"button\" sc-camel-on-click=\"{{ asViewer }}\" style=\"min-height: 46px; border-radius: 10px; border: 2px solid {{roleBorderViewer}}; background: {{roleBgViewer}}; color: {{roleFgViewer}}; font-weight: 700; cursor: pointer\">Viewer<\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ asMod }}\" style=\"min-height: 46px; border-radius: 10px; border: 2px solid {{roleBorderMod}}; background: {{roleBgMod}}; color: {{roleFgMod}}; font-weight: 700; cursor: pointer\">Moderator<\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ asStreamer }}\" style=\"min-height: 46px; border-radius: 10px; border: 2px solid {{roleBorderStreamer}}; background: {{roleBgStreamer}}; color: {{roleFgStreamer}}; font-weight: 700; cursor: pointer\">Streamer<\u002Fbutton>\n    <\u002Fdiv>\n    <span style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.06em\">POLL SHORTCUTS<\u002Fspan>\n    <button type=\"button\" sc-camel-on-click=\"{{ quickStart }}\" style=\"min-height: 46px; border-radius: 10px; border: 1px solid #1b1a17; background: transparent; color: #1b1a17; font-weight: 700; cursor: pointer; text-align: left; padding: 0 12px\">Start example poll: Call of Duty vs Fortnite<\u002Fbutton>\n    <button type=\"button\" sc-camel-on-click=\"{{ skipAhead }}\" style=\"min-height: 46px; border-radius: 10px; border: 1px solid #1b1a17; background: transparent; color: #1b1a17; font-weight: 700; cursor: pointer; text-align: left; padding: 0 12px\">Skip to the last 10 seconds<\u002Fbutton>\n    <button type=\"button\" sc-camel-on-click=\"{{ endTie }}\" style=\"min-height: 46px; border-radius: 10px; border: 1px solid #1b1a17; background: transparent; color: #1b1a17; font-weight: 700; cursor: pointer; text-align: left; padding: 0 12px\">End the poll now as a tie<\u002Fbutton>\n    <button type=\"button\" sc-camel-on-click=\"{{ endNone }}\" style=\"min-height: 46px; border-radius: 10px; border: 1px solid #1b1a17; background: transparent; color: #1b1a17; font-weight: 700; cursor: pointer; text-align: left; padding: 0 12px\">End the poll now with no participation<\u002Fbutton>\n    <span style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.06em\">SIMULATION<\u002Fspan>\n    <button type=\"button\" sc-camel-on-click=\"{{ toggleSilent }}\" style=\"min-height: 46px; border-radius: 10px; border: 1px solid #1b1a17; background: transparent; color: #1b1a17; font-weight: 700; cursor: pointer; text-align: left; padding: 0 12px\">Mock viewers: {{silentLabel}}<\u002Fbutton>\n    <button type=\"button\" sc-camel-on-click=\"{{ toggleFail }}\" style=\"min-height: 46px; border-radius: 10px; border: 1px solid #1b1a17; background: transparent; color: #1b1a17; font-weight: 700; cursor: pointer; text-align: left; padding: 0 12px\">Next Bits contribution fails: {{failLabel}}<\u002Fbutton>\n    <button type=\"button\" sc-camel-on-click=\"{{ sendDuplicate }}\" style=\"min-height: 46px; border-radius: 10px; border: 1px solid #1b1a17; background: transparent; color: #1b1a17; font-weight: 700; cursor: pointer; text-align: left; padding: 0 12px\">Replay your last Bits confirmation (duplicate)<\u002Fbutton>\n    <button type=\"button\" sc-camel-on-click=\"{{ seedPins }}\" style=\"min-height: 46px; border-radius: 10px; border: 1px solid #1b1a17; background: transparent; color: #1b1a17; font-weight: 700; cursor: pointer; text-align: left; padding: 0 12px\">Add two sample pins from earlier streams<\u002Fbutton>\n    <button type=\"button\" sc-camel-on-click=\"{{ resetAll }}\" style=\"min-height: 46px; border-radius: 10px; border: 1px solid #1b1a17; background: transparent; color: #1b1a17; font-weight: 700; cursor: pointer; text-align: left; padding: 0 12px\">Reset prototype<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#7a3ff2&quot;,&quot;options&quot;:[&quot;#7a3ff2&quot;,&quot;#6d28d9&quot;,&quot;#4f46e5&quot;,&quot;#0f766e&quot;],&quot;section&quot;:&quot;Look&quot;},&quot;pollSeconds&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:120,&quot;min&quot;:20,&quot;max&quot;:300,&quot;step&quot;:10,&quot;section&quot;:&quot;Poll&quot;},&quot;overtimeSeconds&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:30,&quot;min&quot;:10,&quot;max&quot;:120,&quot;step&quot;:10,&quot;section&quot;:&quot;Poll&quot;},&quot;pointsPerBit&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:1,&quot;min&quot;:0.1,&quot;max&quot;:10,&quot;step&quot;:0.1,&quot;section&quot;:&quot;Scoring&quot;},&quot;tapPoints&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1,&quot;min&quot;:1,&quot;max&quot;:10,&quot;step&quot;:1,&quot;section&quot;:&quot;Scoring&quot;},&quot;maxTapPoints&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:30,&quot;min&quot;:1,&quot;max&quot;:200,&quot;step&quot;:1,&quot;section&quot;:&quot;Scoring&quot;},&quot;tapCooldownMs&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1000,&quot;min&quot;:200,&quot;max&quot;:5000,&quot;step&quot;:100,&quot;section&quot;:&quot;Scoring&quot;},&quot;rewardMinBits&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:100,&quot;min&quot;:0,&quot;max&quot;:10000,&quot;step&quot;:50,&quot;section&quot;:&quot;Rewards&quot;},&quot;tieRule&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;streamer_decides&quot;,&quot;options&quot;:[&quot;streamer_decides&quot;,&quot;overtime&quot;,&quot;no_winner&quot;],&quot;section&quot;:&quot;Ties&quot;},&quot;noParticipationRule&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;streamer_decides&quot;,&quot;options&quot;:[&quot;streamer_decides&quot;,&quot;no_winner&quot;],&quot;section&quot;:&quot;Ties&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    role: 'viewer', screen: 'stream', pollOpen: false, overlay: null,\n    signedIn: false, signingIn: false,\n    pollNo: 0, phase: 'none', a: '', b: '', sA: 0, sB: 0, tA: 0, tB: 0, timeLeft: 120, totalTime: 120,\n    winner: null, settled: false, overridden: false, overrideOpen: false, overtimeUsed: false,\n    pausedBy: '', myTeam: null, myBits: 0, myTapPts: 0, lastTap: 0, tapFlash: false,\n    balance: 12000, pack: 500, customOn: false, customText: '', bitsPhase: 'review', bitsMsg: '', failNext: false,\n    txSeq: 0, processed: {}, lastTx: null, feed: [], notice: '',\n    draftA: 'Call of Duty', draftB: 'Fortnite', queue: null,\n    editing: false, editA: '', editB: '', confirmCancel: false, log: [],\n    pins: [], minBitsOverride: null, mockSilent: false\n  };\n\n  // ---- Integration seams. Swap each body for the real service later. ----\n  services = {\n    auth: {\n      // SWAP POINT: Twitch sign-in for viewers; role lookup for streamer and moderators.\n      signIn: () => new Promise((resolve) => setTimeout(() => resolve({ handle: 'tidepool_tess' }), 900))\n    },\n    bits: {\n      // SWAP POINT: Twitch's native Bits flow. Resolve { ok: true, txId, amount } only on a confirmed\n      // transaction. The txId is what makes duplicate events detectable.\n      contribute: (amount, txId, simulateFailure) => new Promise((resolve) => setTimeout(() => {\n        if (simulateFailure) resolve({ ok: false, reason: 'declined' });\n        else resolve({ ok: true, txId: txId, amount: amount });\n      }, 1300))\n    },\n    activity: {\n      // SWAP POINT: confirmed contribution events from the backend.\n      mockEvent: () => {\n        const names = ['pixelmoth', 'gravy_goblin', 'sir_snorts', 'lumi_bean', 'kettlecorn', 'moss_dad', 'zerodawn', 'quietfox'];\n        const amounts = [100, 100, 250, 500, 1000];\n        return {\n          name: names[Math.floor(Math.random() * names.length)],\n          team: Math.random() < 0.55 ? 'a' : 'b',\n          amount: amounts[Math.floor(Math.random() * amounts.length)]\n        };\n      }\n    },\n    pins: {\n      // SWAP POINT: persist pins server-side; optionally mirror to the Twitch profile if supported.\n    }\n  };\n\n  componentDidMount() { this.timer = setInterval(() => this.tick(), 1000); }\n  componentWillUnmount() { clearInterval(this.timer); }\n\n  cfg() {\n    const p = this.props;\n    return {\n      ppb: p.pointsPerBit ?? 1, tapPts: p.tapPoints ?? 1, maxTap: p.maxTapPoints ?? 30,\n      cool: p.tapCooldownMs ?? 1000, tieRule: p.tieRule ?? 'streamer_decides',\n      noPart: p.noParticipationRule ?? 'streamer_decides', ot: p.overtimeSeconds ?? 30\n    };\n  }\n  minBits() { return this.state.minBitsOverride !== null ? this.state.minBitsOverride : (this.props.rewardMinBits ?? 100); }\n  fmt(n) { return Math.round(n).toString().replace(/\\B(?=(\\d{3})+(?!\\d))/g, ','); }\n  mmss(t) { return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); }\n  roleName(r) { return r === 'streamer' ? 'Streamer' : (r === 'mod' ? 'Moderator' : 'Viewer'); }\n  teamColor(k) { return k === 'a' ? '#ff7a3d' : '#4fc9ff'; }\n  teamName(k) { return k === 'a' ? (this.state.a || 'Choice A') : (this.state.b || 'Choice B'); }\n  addLog(text) { return [{ id: Date.now() + '-' + Math.random(), text: text }].concat(this.state.log).slice(0, 5); }\n  addFeed(feed, item) { return [Object.assign({ id: Date.now() + '-' + Math.random() }, item)].concat(feed).slice(0, 3); }\n  flashNotice(text)
